name: Daily data update (members & timeline)
run-name: "日次更新 #${{ github.run_number }}"

on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 JST 3:00
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y fonts-noto-cjk
          pip install pandas matplotlib

      - name: Generate spreadsheet tables
        run: |
          failed=0
          for script in members karinhello mixjuice karinmesinging; do
            echo "=== generate_${script}.py ==="
            python "Python/generate_${script}.py" || { echo "::error::${script} failed"; failed=1; }
          done
          exit $failed
        env:
          # 1日1ハロのポスト本文検索の索引。リポジトリには入れず、後のステップで D1 に適用する
          KARINHELLO_INDEX_SQL: build/karinhello_index.sql

      - name: Generate timeline images
        run: python Python/timeline.py

      # ハロプロ研修生ブログ インデックス(upfc.jp の一覧から 記事ID・日付・書いた人 だけ)。
      # 毎日全ページ(約80ページ・1秒に1回)を読み直し、upfc.jp から消えた記事はこちらからも消す。
      # 失敗しても表やタイムラインの更新は止めない(失敗・消えた記事は Actions の警告に出る)
      - name: Update kenshusei blog index
        continue-on-error: true
        run: python Python/generate_kenshusei_blog.py --full

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Spreadsheet Generated Timeline data/kenshusei-blog.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動更新: テーブル・タイムライン ($(date -u +%Y-%m-%d))"
            # 別のワークフローが同時にmainへpushしているとfast-forwardで弾かれるので、
            # rebaseしてから数回リトライする
            pushed=0
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { echo "rebase失敗"; break; }
              if git push; then pushed=1; break; fi
              echo "push競合、リトライ ($i)…"; sleep 3
            done
            if [ "$pushed" != "1" ]; then echo "::error::リトライしてもpushできませんでした"; exit 1; fi
            # GITHUB_TOKENによるpushはon:pushを発火させないため明示的にデプロイを起動
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # 表の更新を止めないよう、検索索引の適用はコミットの後にする
      - name: Update karin-hello search index (D1)
        if: hashFiles('build/karinhello_index.sql') != ''
        run: |
          npx wrangler@4 d1 execute karin-hello --remote --file worker/karinhello-schema.sql
          npx wrangler@4 d1 execute karin-hello --remote --file build/karinhello_index.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
