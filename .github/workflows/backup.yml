name: Full Backup to Releases

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set current time
        id: time
        run: echo "date=$(TZ='Asia/Tokyo' date +'%Y-%m-%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Archive
        run: |
          mkdir -p archives
          zip -r "archives/backup-${{ steps.time.outputs.date }}.zip" . \
            -x "archives/*" ".git/*" ".github/*"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ steps.time.outputs.date }}
          name: Backup ${{ steps.time.outputs.date }}
          files: archives/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
