name: Manual data generation

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どのデータを再生成するか'
        required: true
        type: choice
        options:
          - birthday
          - mhello
          - cooking
          - karinhello
          - karinoshi
          - mixjuice
          - vocalo
          - all

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run generators
        run: |
          t="${{ inputs.target }}"
          run_if() { if [ "$t" = "$1" ] || [ "$t" = "all" ]; then python "Python/$2"; fi; }
          run_if birthday   hello-birthday.py
          run_if mhello     generate_mhello.py
          run_if cooking    generate_hello_cooking.py
          run_if karinhello generate_karinhello.py
          run_if karinoshi  generate_karinoshi.py
          run_if mixjuice   generate_mixjuice.py
          run_if vocalo     generate_vocalo.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Birthday Spreadsheet Generated
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動生成: ${{ inputs.target }} ($(date -u +%Y-%m-%d))"
            git push
            # GITHUB_TOKENによるpushはon:pushを発火させないため明示的にデプロイを起動
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
