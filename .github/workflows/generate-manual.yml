name: Manual data generation
run-name: "手動生成: ${{ inputs.target }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どのデータを再生成するか'
        required: true
        type: choice
        # 「値 (説明)」形式。実行時は先頭の空白までを取り出して使う
        options:
          - "birthday (バースデーイベント)"
          - "mhello (エムハロイベント)"
          - "cooking (クッキングコーナー)"
          - "hanakin (宮本佳林のIGチャレンジ)"
          - "karinhello (佳林の1日1ハロ)"
          - "karinoshi (カリンオシ)"
          - "members (メンバー一覧)"
          - "mixjuice (MIX=Juice)"
          - "oneplusone (ONE PLUS ONE・One on One)"
          - "movies (出演映画)"
          - "vocalo (今日のボカロ)"
          - "vocaloclub (宮本佳林のボカロ部)"
          - "interview (インタビュー記事)"
          - "gamelive (ハロ通LIVE/GAMES)"
          - "sns (SNS一覧)"
          - "shopevent (ハロショイベント)"
          - "timeline (在籍タイムライン画像)"
          - "all (すべて)"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (timeline only)
        if: ${{ startsWith(inputs.target, 'timeline') || startsWith(inputs.target, 'all') }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y fonts-noto-cjk
          pip install pandas matplotlib requests

      - name: Run generators
        env:
          # generate_interview.py が Domain未登録URLのIssue本文をここへ書く(未実行なら作られない)
          INTERVIEW_DOMAIN_REPORT: ${{ runner.temp }}/interview_domain.md
          # 同じく、メンバーシートの名前がよみがなマスターに無いときのIssue本文
          INTERVIEW_MEMBER_REPORT: ${{ runner.temp }}/interview_member.md
          # 同じく、スプシの入力ミス(URL欄がURLでない・ID欄が空など)のIssue本文
          INTERVIEW_DATA_REPORT: ${{ runner.temp }}/interview_data.md
        run: |
          t="${{ inputs.target }}"
          t="${t%% *}"   # "movies (出演映画)" → "movies"
          echo "TARGET=$t" >> "$GITHUB_ENV"
          run_if() { if [ "$t" = "$1" ] || [ "$t" = "all" ]; then python "Python/$2"; fi; }
          run_if birthday   hello-birthday.py
          run_if mhello     generate_mhello.py
          run_if cooking    generate_hello_cooking.py
          run_if hanakin    generate_hanakin.py
          run_if karinhello generate_karinhello.py
          run_if karinoshi  generate_karinoshi.py
          run_if members    generate_members.py
          run_if mixjuice   generate_mixjuice.py
          run_if oneplusone generate_oneplusone.py
          run_if movies     generate_movies.py
          run_if vocalo     generate_vocalo.py
          run_if vocaloclub generate_vocaloclub.py
          run_if interview  generate_interview.py
          run_if gamelive   generate_gamelive.py
          run_if sns        generate_sns.py
          run_if shopevent  generate_shopevent.py
          run_if timeline   timeline.py

      # インタビューのシートに要確認の行があればIssueを種類ごとに1本だけ立てる(既にあれば内容が変わった時だけ更新)。
      #   Domain未登録URL / よみがなマスターに無いメンバー名 / スプシの入力ミス
      # 全部解消したら自動でクローズ。通知の失敗でデータ更新(下のcommit)を止めない。
      - name: インタビューの要確認Issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TMP: ${{ runner.temp }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # sync_issue 本文ファイル ラベル タイトル 何の一覧か
          sync_issue() {
            REPORT=$1; LABEL=$2; TITLE=$3; WHAT=$4
            if [ ! -f "$REPORT" ]; then echo "interviewは今回未実行"; return; fi
            gh label create "$LABEL" --color 8C6BB8 --description "$WHAT" 2>/dev/null || true
            ISSUE=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
            if [ -s "$REPORT" ]; then
              if [ -z "$ISSUE" ]; then
                gh issue create --title "$TITLE" --label "$LABEL" --body-file "$REPORT"
              elif [ "$(gh issue view "$ISSUE" --json body --jq .body)" != "$(cat "$REPORT")" ]; then
                gh issue edit "$ISSUE" --body-file "$REPORT"
                gh issue comment "$ISSUE" --body "🔁 ${WHAT}の一覧が変わったので更新しました（[実行ログ]($RUN_URL)）。"
              else
                echo "Issue #$ISSUE と内容が同じなので通知しない"
              fi
            elif [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "✅ ${WHAT}がなくなったのでクローズします（[実行ログ]($RUN_URL)）。"
              gh issue close "$ISSUE"
            else
              echo "${WHAT}なし"
            fi
          }
          sync_issue "$TMP/interview_domain.md" interview-domain \
            "🌐 インタビュー: Domainシート未登録のURLがあります" "インタビューのDomain未登録URL"
          sync_issue "$TMP/interview_member.md" interview-member \
            "👤 インタビュー: よみがなマスターに無いメンバー名があります" "インタビューのマスター未登録メンバー"
          sync_issue "$TMP/interview_data.md" interview-data \
            "🧹 インタビュー: スプレッドシートに入力ミスがあります" "インタビューのスプシ入力ミス"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Birthday Spreadsheet Generated Timeline
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動生成: $TARGET ($(date -u +%Y-%m-%d))"
            # 別のワークフローが同時にmainへpushしているとfast-forwardで弾かれるので、
            # rebaseしてから数回リトライする
            pushed=0
            for i in 1 2 3 4 5; do
              git pull --rebase origin main || { echo "rebase失敗"; break; }
              if git push; then pushed=1; break; fi
              echo "push競合、リトライ ($i)…"; sleep 3
            done
            if [ "$pushed" != "1" ]; then echo "::error::リトライしてもpushできませんでした"; exit 1; fi
            # GITHUB_TOKENによるpushはon:pushを発火させないため明示的にデプロイを起動
            gh workflow run deploy.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
