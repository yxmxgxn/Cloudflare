name: Build & Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Python/**'
      - 'README*'
      - 'docs/**'          # 保守メモ。公開物には含まれないので再デプロイ不要
      - 'link-check/**'    # リンクチェックの除外リスト。同上
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # IndexNow用に直前コミットとの差分を取る

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Build static site
        env:
          # Variables に BASE_URL を設定するまでは旧ドメインのまま出力される
          BASE_URL: ${{ vars.BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: bash build/build.sh

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: Dump wrangler logs on failure
        if: failure()
        run: cat /home/runner/.config/.wrangler/logs/*.log || true

      - name: IndexNow Notification
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          [ -z "$INDEXNOW_KEY" ] && { echo "INDEXNOW_KEY未設定のためスキップ"; exit 0; }
          HOST=$(echo "$BASE_URL" | sed 's|https\?://||; s|/.*||')
          # Secret に改行や空白が紛れていてもURLを壊さないよう削る(build.sh側と揃える)
          INDEXNOW_KEY=$(printf '%s' "$INDEXNOW_KEY" | tr -d '[:space:]')
          KEY_URL="$BASE_URL/$INDEXNOW_KEY.txt"
          # キーファイルを配信できていないと Bing は 422 を返す。先に自己診断する。
          # (キー自体はログでマスクされるので、長さと突き合わせ結果だけ出す)
          echo "キーの長さ: ${#INDEXNOW_KEY} 文字"
          # デプロイ直後は伝播待ちで404になることがあるので数回試す
          for i in 1 2 3 4 5; do
            KEY_STATUS=$(curl -s -o /tmp/indexnow-key -w '%{http_code}' "$KEY_URL")
            echo "キーファイル $KEY_URL → HTTP $KEY_STATUS ($i回目)"
            [ "$KEY_STATUS" = "200" ] && break
            sleep 10
          done
          if [ "$KEY_STATUS" != "200" ]; then
            echo "::warning::キーファイルが配信されていない。build.sh の出力(public/<キー>.txt)を確認すること"
          elif [ "$(cat /tmp/indexnow-key)" != "$INDEXNOW_KEY" ]; then
            echo "::warning::キーファイルの中身がキーと一致しない"
          else
            echo "キーファイルOK"
          fi
          DIFF_URLS=$(git diff --name-only --diff-filter=ACM HEAD^ HEAD 2>/dev/null \
            | grep -E '\.php$' \
            | grep -v '^common/' \
            | grep -v '^Spreadsheet/' \
            | grep -v '^Generated/' \
            | grep -v '^build/' \
            | grep -v '404' \
            | grep -v '^index\.' \
            | sed -E 's/\.php$//' \
            | sed "s|^|$BASE_URL/|" \
            | tr '\n' ' ') || true
          CLEAN_URLS=$(echo "$BASE_URL/ $DIFF_URLS" | tr -s ' ' | sed 's/^ //;s/ $//')
          echo "Sending URLs: $CLEAN_URLS"
          JSON_URLS=$(echo "$CLEAN_URLS" | tr ' ' '\n' | grep -v '^$' | sed 's/.*/"&"/' | paste -sd ',')
          # 本文には 422 の理由が書いてあるので捨てない
          curl -s -w '\nIndexNow HTTP status: %{http_code}\n' \
            -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\": \"$HOST\", \"key\": \"$INDEXNOW_KEY\", \"keyLocation\": \"$KEY_URL\", \"urlList\": [$JSON_URLS]}"
