name: Wikipedia movie check
run-name: "Wikipedia映画チェック #${{ github.run_number }}"

on:
  schedule:
    - cron: '30 19 * * *'   # 毎日 JST 4:30(日次更新のあと)
  workflow_dispatch:
    inputs:
      hours:
        description: 'この時間以内に編集されたページを調べる(初回の洗い出しは 100000)'
        default: '25'
      dry_run:
        description: 'Discordに送らずログに出す'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Wikipedia movie sections
        run: |
          args="--hours ${HOURS:-25}"
          if [ "$DRY_RUN" = "true" ]; then args="$args --dry-run"; fi
          python Python/check_wikipedia_movies.py $args
        env:
          HOURS: ${{ inputs.hours }}
          DRY_RUN: ${{ inputs.dry_run }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
