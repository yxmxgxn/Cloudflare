name: Link check (monthly)
run-name: "リンクチェック #${{ github.run_number }}"

on:
  schedule:
    - cron: '0 3 1 * *'   # 毎月1日 JST 12:00
  workflow_dispatch:
    inputs:
      delay_scale:
        description: 'リクエスト間隔の倍率(急ぎたいとき 0.5、優しくしたいとき 2 など)'
        required: false
        default: '1.0'

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # ビルド済みのチェッカーを main ブランチ用に保存しておき、毎月コンパイルし直さない
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: link-check

      # 公開されるHTMLそのものを検査したいので、デプロイと同じ手順でビルドする
      - name: Build static site
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: bash build/build.sh

      # report.md は全件(成果物に残す)、report-issue.md は Issue 本文の文字数制限に収めたもの
      - name: Check links
        run: |
          cargo run --release --locked --manifest-path link-check/Cargo.toml -- \
            --root public \
            --base-url "${BASE_URL:-https://karin-archive.com}" \
            --out report.md \
            --issue-out report-issue.md \
            --stats stats.json \
            --delay-scale "${{ github.event.inputs.delay_scale || '1.0' }}"
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: link-check-report
          path: |
            report.md
            stats.json
          retention-days: 90

      - name: Summary
        if: always()
        run: cat report-issue.md >> "$GITHUB_STEP_SUMMARY" || true

      # 壊れたリンクか https に貼り替えられるリンクがあればIssueを1本だけ立てる
      # (既にあれば本文を差し替える)。全部直ってチェックが通ったら自動でクローズする。
      - name: Create or update issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BROKEN=$(jq '.broken_total' stats.json)
          HTTPS=$(jq '.https // 0' stats.json)
          TITLE="🔗 リンク切れレポート ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          gh label create link-check --color 8C6BB8 --description "リンクチェックの自動レポート" 2>/dev/null || true
          ISSUE=$(gh issue list --label link-check --state open --limit 1 --json number --jq '.[0].number // empty')

          {
            echo "🔗 サイト内の全リンクを自動チェックした結果です（[実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})）。"
            echo
            cat report-issue.md
          } > issue-body.md

          if [ "$BROKEN" -gt 0 ] || [ "$HTTPS" -gt 0 ]; then
            if [ -n "$ISSUE" ]; then
              # タイトルの日付も差し替えて、いつ時点の結果か一覧から分かるようにする
              gh issue edit "$ISSUE" --title "$TITLE" --body-file issue-body.md
              gh issue comment "$ISSUE" --body "🔁 最新のチェック結果に更新しました（リンク切れ ${BROKEN} 件・https化 ${HTTPS} 件）。"
              echo "Issue #$ISSUE を更新しました"
            else
              gh issue create \
                --title "$TITLE" \
                --label link-check \
                --body-file issue-body.md
            fi
          else
            echo "リンク切れ・https化なし"
            if [ -n "$ISSUE" ]; then
              gh issue comment "$ISSUE" --body "✅ 今回のチェックではリンク切れ・https化ともにゼロだったのでクローズします。"
              gh issue close "$ISSUE"
            fi
          fi
