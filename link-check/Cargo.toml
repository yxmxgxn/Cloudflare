[package]
name = "link-check"
version = "0.1.0"
edition = "2024"
publish = false
description = "Python/check_links.py の Rust 版(移植中)"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
htmlize = { version = "1.1", features = ["unescape"] }
percent-encoding = "2.3"
regex = "1.13"
reqwest = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
